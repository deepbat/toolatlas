name: Apply category sections redesign (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify baseline
        run: test "$(git rev-parse HEAD)" = "19a1ed2434081987e2a2ea0653b908baf1e3919d"
      - name: Apply patch
        run: |
          echo '' | base64 -d | gunzip | git apply -v
      - name: Remove one-time workflows
        run: git rm -q -f .github/workflows/apply-*.yml .github/workflows/pdf-text-fix.yml .github/workflows/toolatlas-upgrade.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:search
      - run: npm run test:unit
      - run: npm run test:expanded
      - run: npm run test:studio
      - name: Push branch
        run: |
          git config user.name toolatlas-bot
          git config user.email toolatlas-bot@users.noreply.github.com
          git checkout -b feature/category-sections
          git add -A
          git commit -m "Add category sections: 8 top-level categories with dedicated pages and URLs"
          git push origin feature/category-sections
          git push origin --delete fix/mobile-layout || true
