name: Apply reviewed device sensor tools
on:
  push:
    paths:
      - .github/workflows/apply-device.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply the reviewed patch
        run: |
          echo '' | base64 -d | gunzip > /tmp/device.patch
          echo '4d2c998806e36efe5fe9f472f2181aea914cb8a5900e850bd71add838b7f7a87  /tmp/device.patch' | sha256sum -c -
          git checkout -B feature/device-sensor-tools
          git apply --check /tmp/device.patch
          git apply /tmp/device.patch
      - name: Commit and push the feature branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/apply-device.yml
          git add -A
          git commit -m "Add Device & Sensor tools benchmarked against alltools.link"
          git push -f origin feature/device-sensor-tools
