name: Apply category directory and useful utilities
on:
  push:
    paths: ['.github/workflows/apply-directory.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check source baseline and apply tested changes
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "7fc649129f951cc6b6d367e40aacbb4b6cc05f3f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/apply-directory.yml"
          echo '' | base64 -d | gzip -d > /tmp/directory.patch
          git apply --check /tmp/directory.patch
          git switch -c feature/directory-and-utilities
          git apply /tmp/directory.patch
          git config user.name "Deepak Batra"
          git config user.email "deepbat@users.noreply.github.com"
          git add src scripts package.json docs README.md
          git commit -m "Lead with categories and add researched ZIP image and display tools"
          git push origin feature/directory-and-utilities 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
