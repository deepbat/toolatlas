name: Apply hero categories (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify baseline
        run: test "$(git rev-parse HEAD)" = "00a85b859a722399ad38b6ae38c6c3ae508b772e"
      - name: Apply patch
        run: |
          echo '' | base64 -d | gunzip > hero.patch
          git apply hero.patch
          rm hero.patch
      - name: Remove one-time workflow
        run: git rm -q -f .github/workflows/apply-hero.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:search
      - run: npm run test:unit
      - run: npm run test:expanded
      - name: Push branch
        run: |
          git config user.name toolatlas-bot
          git config user.email toolatlas-bot@users.noreply.github.com
          git checkout -b feature/hero-categories
          git add -A
          git commit -m "Show category cards in the homepage hero"
          git push origin feature/hero-categories
