name: Apply native media tools
on:
  push:
    paths: ['.github/workflows/apply-media.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify baseline and apply tested patch
        run: |
          test "$(git rev-parse HEAD^)" = "66a7f3f1d7bf0f3b407c6a99d9c4dbf2f4e8ad11"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/apply-media.yml"
          echo '' | base64 -d | gzip -d > /tmp/media.patch
          git apply --check /tmp/media.patch
          git switch -c feature/native-media-tools
          git apply /tmp/media.patch
          rm .github/workflows/apply-media.yml
          git config user.name "Deepak Batra"
          git config user.email "deepbat@users.noreply.github.com"
          git add src scripts package.json .github/workflows docs README.md
          git commit -m "Add 12 native browser audio and video tools with export regressions"
          git push origin feature/native-media-tools
