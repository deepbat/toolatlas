name: Apply mobile layout fix (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo '' | base64 -d | gunzip | git apply -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:search
      - run: npm run test:unit
      - run: npm run test:expanded
      - run: npm run test:studio
      - name: Push branch
        run: |
          git config user.name toolatlas-bot
          git config user.email toolatlas-bot@users.noreply.github.com
          git checkout -b fix/mobile-layout
          git add -A
          git commit -m "Fix narrow-viewport layout: shrink header, stop hero overflow, keep minimum scale"
          git push origin fix/mobile-layout
