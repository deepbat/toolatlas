      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:search
      - run: npm run test:unit
      - run: npm run test:expanded
      - run: npm run test:studio
      - name: Push feature branch
        run: |
          git config user.name "toolatlas-bot"
          git config user.email "toolatlas-bot@users.noreply.github.com"
          git checkout -b feature/studio-batch-1
          git add -A -- . ':!test-artifacts' ':!dist'
          git commit -m "Add Studio batch 1: 7 PDF tools and 7 image tools, tests and docs"
          git push origin feature/studio-batch-1
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head feature/studio-batch-1 --title "Studio batch 1: PDF and image tools" --body "Adds 14 PDF and image tools (103 total), unit and browser tests, docs and CI steps. All checks ran in this workflow before the push." || echo "PR creation not permitted; open manually"
