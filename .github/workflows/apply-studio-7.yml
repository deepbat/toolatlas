      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:search
      - run: npm run test:unit
      - run: npm run test:expanded
      - run: npm run test:studio
      - name: Push feature branch
        run: |
          git config user.name "toolatlas-bot"
          git config user.email "toolatlas-bot@users.noreply.github.com"
          git checkout -b feature/pwa-offline
          git add -A
          git commit -m "PWA: offline page with progress and repair, offline banner, update prompt, docs"
          git push origin feature/pwa-offline
