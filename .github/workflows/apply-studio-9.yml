      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:search
      - run: npm run test:unit
      - run: npm run test:expanded
      - run: npm run test:studio
      - run: npm run test:quality
      - run: npm run test:a11y
      - name: Push feature branch
        run: |
          git config user.name "toolatlas-bot"
          git config user.email "toolatlas-bot@users.noreply.github.com"
          git checkout -b feature/quality
          git add -A
          git commit -m "Add quality and accessibility checks, label and button name fixes, quality docs"
          git push origin feature/quality
