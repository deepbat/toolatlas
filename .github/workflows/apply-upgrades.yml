name: Apply reviewed platform upgrade
on:
  push:
    paths:
      - .github/workflows/apply-upgrades.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact reviewed patch on a separate branch
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "failed at line $LINENO"' ERR
          test "$(git rev-parse HEAD^)" = "168926e46959f526b0c4f9619cacb654afb41f2d"
          echo '' | base64 -d | gzip -d > /tmp/upgrade.patch
          echo '10303efab48f931c12fe504b622b8e25194faee7b5098255b25d864486647b5a  /tmp/upgrade.patch' | sha256sum -c -
          git switch -c feature/platform-practical-tools
          git apply --check /tmp/upgrade.patch
          git apply /tmp/upgrade.patch
          git config user.name deepbat
          git config user.email deepbat@users.noreply.github.com
          git add README.md docs package.json scripts src
          git commit -m "Add local workflows, practical tools and invoice/fuel upgrades"
          git push origin feature/platform-practical-tools
