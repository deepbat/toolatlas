name: ToolAtlas CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production site
        run: npm run build

      - name: Run search regression tests
        run: npm run test:search

      - name: Run expanded browser regression suite
        run: npm run test:expanded

      - name: Upload browser evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolatlas-browser-evidence
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
