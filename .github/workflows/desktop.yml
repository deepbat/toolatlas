name: Desktop build (Tauri)

# Separate from ci.yml and deploy.yml. Manual only, so it never runs on pushes.
# Uses free GitHub-hosted runners only. No signing certificates or secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer (unsigned)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build static site at root path
        run: npm run build
        env:
          BASE_PATH: /
      - name: Generate app icons from the existing 512px icon
        run: npx --yes @tauri-apps/cli@2 icon public/icon-512.png
      - name: Resolve Cargo.lock (generated only if none is committed)
        working-directory: src-tauri
        run: |
          if (-not (Test-Path Cargo.lock)) { cargo generate-lockfile; "Cargo.lock was NOT committed: generated fresh" } else { "Cargo.lock committed" }
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
      - name: Bundle Rust licence texts for the installer
        run: node scripts/bundle-licences.mjs x86_64-pc-windows-msvc
      - name: Reconcile the licence bundle with cargo tree (linked crates vs bundled index)
        run: node scripts/check-licence-coverage.mjs x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: rust-licence-bundle
          path: src-tauri/licenses/*.txt
          if-no-files-found: error
      - name: Unit test the in-code window authorization rule (cargo test)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml native_pdf
      - name: Build NSIS installer
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis -- --locked
      - name: Verify the production installer carries the licence files (7z listing)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          7z l $exe.FullName | Select-String -Pattern 'licenses' | ForEach-Object { $_.Line }
          $n = (7z l $exe.FullName | Select-String -Pattern 'RUST_LICENSES.txt|THIRD_PARTY_NOTICES.txt').Count
          "licence files listed in installer: $n"
          if ($n -lt 2) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: deepaks-tool-windows-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Production binary carries the save command and none of the test hooks (string scan)
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/deepaks-tool.exe'
          "binary: $((Get-Item $exe).Length) bytes"
          $fail = 0
          foreach ($t in @('__test_hold__','__test_fail__','callmarker','forced failure for cleanup test','test-print','printview-*','test-nocsp')) {
            if (Select-String -Path $exe -Pattern $t -SimpleMatch -Quiet) { "FAIL: production binary contains '$t'"; $fail = 1 } else { "ok: production binary has no '$t'" }
          }
          if (Select-String -Path $exe -Pattern 'save_print_pdf' -SimpleMatch -Quiet) { "ok: save_print_pdf command is present" } else { "FAIL: save_print_pdf missing"; $fail = 1 }
          $cfg = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          "production config capabilities: $($cfg.app.security.capabilities -join ',')"
          if (($cfg.app.security.capabilities -join ',') -ne 'default') { "FAIL: production config enables more than the default capability"; $fail = 1 }
          if ($fail) { exit 1 }
      - name: Build test-only installer (remote debugging port on, for CI functional test)
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis --config src-tauri/tauri.test.conf.json --features native-pdf-test -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: deepaks-tool-windows-TESTONLY
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Control, the test build does contain the hooks (so the scan above can fail)
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/deepaks-tool.exe'
          if (Select-String -Path $exe -Pattern '__test_hold__' -SimpleMatch -Quiet) { "ok: test build contains the hook string, the scan method works" } else { "FAIL: control string not found in the test build"; exit 1 }
          if (Select-String -Path $exe -Pattern 'printview-*' -SimpleMatch -Quiet) { "info: test build embeds the test-print window grant as plain text, so the production scan for it is meaningful" } else { "info: test-print grant is NOT found as plain text in the test build, so the production string scan for it proves nothing; the production config check above is the evidence" }

  linux:
    name: Linux build (secondary)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build static site at root path
        run: npm run build
        env:
          BASE_PATH: /
      - run: npx --yes @tauri-apps/cli@2 icon public/icon-512.png
      - run: npx --yes @tauri-apps/cli@2 build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: deepaks-tool-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  smoke-windows:
    name: Windows smoke test (install, launch, screenshot)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: deepaks-tool-windows-unsigned
          path: installer
      - name: Silent install, launch, screenshot
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
          "Installer: $($exe.Name) $([math]::Round($exe.Length/1MB,1)) MB"
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
          Get-AuthenticodeSignature $exe.FullName | Select-Object Status, StatusMessage | Format-List
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait -PassThru
          "Installer exit code: $($p.ExitCode)"
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          "Installed exe: $($app.FullName)"
          $dir = Split-Path $app.FullName
          $lic = Get-ChildItem $dir -Recurse -Include RUST_LICENSES.txt,THIRD_PARTY_NOTICES.txt -ErrorAction SilentlyContinue
          $lic | ForEach-Object { "installed licence file: $($_.FullName) $($_.Length) bytes" }
          if (@($lic).Count -lt 2) { "FAIL: licence files missing from the install dir"; exit 1 }
          if (Select-String -Path ($lic | Where-Object Name -eq 'RUST_LICENSES.txt').FullName -Pattern 'Bill Avery' -Quiet) { "PASS: upstream holder text present in installed RUST_LICENSES.txt" } else { "FAIL: holder text missing"; exit 1 }
          $proc = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 25
          $proc.Refresh()
          "App running after 25s: $(-not $proc.HasExited)"
          "WebView2 children: $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Measure-Object).Count)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\win-smoke.png")
          if ($proc.HasExited) { exit 1 }
          Stop-Process -Id $proc.Id -Force
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Production installer, default save path (WebView2 attached by registry policy)
        shell: pwsh
        timeout-minutes: 8
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-Process deepaks-tool,msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          "production exe: $($app.FullName) $((Get-Item $app.FullName).Length) bytes"
          # The environment variable is ignored by this app (it sets its own browser arguments), so use the WebView2 policy key.
          $k = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name 'deepaks-tool.exe' -Value '--remote-debugging-port=9222' -PropertyType String -Force | Out-Null
          Start-Process -FilePath $app.FullName
          Start-Sleep -Seconds 12
          "processes after launch:"; Get-Process deepaks-tool,msedgewebview2 -ErrorAction SilentlyContinue | Select-Object Name,Id | Format-Table | Out-String
          "port 9222:"; (netstat -ano | Select-String ':9222') -join "`n"
          try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9222/json).Content.Substring(0,300) } catch { "json endpoint: $($_.Exception.Message)" }
          node scripts/desktop-prodsave.mjs *>&1 | Tee-Object -FilePath out/prod-save-log.txt
          "prodsave exit: $LASTEXITCODE"
          Get-Process deepaks-tool -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/download-artifact@v4
        with:
          name: deepaks-tool-windows-TESTONLY
          path: installer-test
      - name: Functional test in the desktop window (test-only build)
        shell: pwsh
        timeout-minutes: 10
        run: |
          Get-Process deepaks-tool -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Get-ChildItem installer-test -Filter *.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $proc = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 10
          node scripts/desktop-smoke.mjs
          $a = $LASTEXITCODE
          "smoke exit: $a"
          node scripts/desktop-convert.mjs
          $b = $LASTEXITCODE
          "convert exit: $b"
          Start-Sleep -Seconds 2
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $sb = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $sbmp = New-Object System.Drawing.Bitmap $sb.Width, $sb.Height
          [System.Drawing.Graphics]::FromImage($sbmp).CopyFromScreen($sb.Location, [System.Drawing.Point]::Empty, $sb.Size)
          $sbmp.Save("$PWD\win-print.png")
          if ($a -ne 0 -or $b -ne 0) { exit 1 }
      - name: Native print dialog, Microsoft Print to PDF save (keyboard automation)
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Snap($n) { $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $m = New-Object System.Drawing.Bitmap $b.Width, $b.Height; [System.Drawing.Graphics]::FromImage($m).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $m.Save("$PWD\out\$n.png") }
          $sh = New-Object -ComObject WScript.Shell
          $ok = $sh.AppActivate("Deepak's Tool")
          "activate: $ok"
          Start-Sleep -Seconds 2
          Snap 'native-1-before-print'
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 5
          Snap 'native-2-after-enter'
          Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object Name, MainWindowTitle | Format-Table | Out-String
          $target = "$PWD\out\native-print.pdf"
          [System.Windows.Forms.SendKeys]::SendWait($target)
          Start-Sleep -Seconds 1
          Snap 'native-3-typed-path'
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 6
          Snap 'native-4-after-save'
          "native-print.pdf exists: $(Test-Path $target)"
          Get-ChildItem out, "$env:USERPROFILE\Documents", "$env:USERPROFILE\Downloads" -Filter *.pdf -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table | Out-String
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Save print views as PDF through WebView2 (raw CDP)
        shell: pwsh
        timeout-minutes: 8
        run: |
          Get-Process deepaks-tool,msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Start-Process -FilePath $app.FullName
          Start-Sleep -Seconds 10
          node scripts/desktop-printpdf.mjs
          "printpdf exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Indic PDF to Word saved output
        shell: pwsh
        timeout-minutes: 4
        run: |
          node scripts/desktop-indic-p2w.mjs
          "indic p2w exit: $LASTEXITCODE"
      - name: Newer conversion paths in the installed app (Unicode layer, Hindi/Punjabi OCR, merged cells)
        shell: pwsh
        timeout-minutes: 9
        run: |
          node scripts/desktop-newpaths.mjs *>&1 | Tee-Object -FilePath out/newpaths-log.txt
          "newpaths exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Real download file name (raw CDP, no Playwright)
        shell: pwsh
        timeout-minutes: 8
        run: |
          Get-Process deepaks-tool -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $before = @(Get-ChildItem "$env:USERPROFILE\Downloads" -ErrorAction SilentlyContinue | ForEach-Object Name)
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Start-Process -FilePath $app.FullName
          Start-Sleep -Seconds 10
          node scripts/desktop-download-names.mjs
          Start-Sleep -Seconds 3
          "Downloads before: $($before -join ', ')"
          "Downloads after:"
          Get-ChildItem "$env:USERPROFILE\Downloads" -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table | Out-String
          Get-ChildItem "$env:USERPROFILE" -Recurse -Filter 'names-test*' -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table | Out-String
      - name: Native PDF save prototype (WebView2 PrintToPdf through a Rust command)
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          Get-Process deepaks-tool,msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Start-Process -FilePath $app.FullName
          Start-Sleep -Seconds 10
          node scripts/desktop-nativesave.mjs
          "nativesave exit: $LASTEXITCODE"
      - name: Native PDF save, real tools, isolation, authorization, cleanup
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        run: |
          Get-Process deepaks-tool,msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Start-Process -FilePath $app.FullName
          Start-Sleep -Seconds 10
          node scripts/desktop-nativereal.mjs *>&1 | Tee-Object -FilePath out/native-real-log.txt
          "nativereal exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-screenshot
          path: |
            win-smoke.png
            win-after.png
            win-print.png
            rotated.pdf
            ocr.pdf
            out/*

  smoke-linux:
    name: Linux smoke test (xvfb, screenshot)
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deepaks-tool-linux-deb
          path: pkg
      - name: Install, launch under xvfb, screenshot
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick x11-utils xdotool openbox ./pkg/*.deb
          ls -la pkg
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          openbox &
          sleep 2
          WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 deepaks-tool > app.log 2>&1 &
          APP=$!
          sleep 25
          if kill -0 $APP; then echo "app running"; else echo "app exited"; cat app.log; exit 1; fi
          xwininfo -root -tree | head -30
          xdotool search --name "Deepak" 2>/dev/null | head -3 || true
          import -window root linux-smoke.png
          identify linux-smoke.png
          cat app.log | head -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-screenshot
          path: linux-smoke.png
