name: Desktop build (Tauri)

# Separate from ci.yml and deploy.yml. Manual only, so it never runs on pushes.
# Uses free GitHub-hosted runners only. No signing certificates or secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer (unsigned)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build static site at root path
        run: npm run build
        env:
          BASE_PATH: /
      - name: Generate app icons from the existing 512px icon
        run: npx --yes @tauri-apps/cli@2 icon public/icon-512.png
      - name: Build NSIS installer
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: deepaks-tool-windows-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: List Rust crate licences (production build, Windows target)
        working-directory: src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../out | Out-Null
          cargo metadata --format-version 1 --filter-platform x86_64-pc-windows-msvc | Out-File -Encoding utf8 ../out/meta.json
          node -e "const m=JSON.parse(require('fs').readFileSync('../out/meta.json','utf8'));const fs=require('fs'),path=require('path');const rows=m.packages.filter(p=>p.source).map(p=>{const d=path.dirname(p.manifest_path);const lf=fs.readdirSync(d).filter(f=>/^(LICEN[CS]E|COPYING|NOTICE|UNLICENSE)/i.test(f));return [p.name,p.version,p.license||p.license_file||'NONE',lf.join('+')||'no-file-in-crate'].join('\t')}).sort();fs.writeFileSync('../out/rust-licenses.tsv',rows.join('\n'));console.log(rows.length+' crates')"
          Get-Content ../out/rust-licenses.tsv | Measure-Object -Line
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crate-licences
          path: out/rust-licenses.tsv
          if-no-files-found: error
      - name: Build test-only installer (remote debugging port on, for CI functional test)
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis --config src-tauri/tauri.test.conf.json --features native-pdf
      - uses: actions/upload-artifact@v4
        with:
          name: deepaks-tool-windows-TESTONLY
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux build (secondary)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build static site at root path
        run: npm run build
        env:
          BASE_PATH: /
      - run: npx --yes @tauri-apps/cli@2 icon public/icon-512.png
      - run: npx --yes @tauri-apps/cli@2 build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: deepaks-tool-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  smoke-windows:
    name: Windows smoke test (install, launch, screenshot)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: deepaks-tool-windows-unsigned
          path: installer
      - name: Silent install, launch, screenshot
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
          "Installer: $($exe.Name) $([math]::Round($exe.Length/1MB,1)) MB"
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
          Get-AuthenticodeSignature $exe.FullName | Select-Object Status, StatusMessage | Format-List
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait -PassThru
          "Installer exit code: $($p.ExitCode)"
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          "Installed exe: $($app.FullName)"
          $proc = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 25
          $proc.Refresh()
          "App running after 25s: $(-not $proc.HasExited)"
          "WebView2 children: $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Measure-Object).Count)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\win-smoke.png")
          if ($proc.HasExited) { exit 1 }
          Stop-Process -Id $proc.Id -Force
      - uses: actions/download-artifact@v4
        with:
          name: deepaks-tool-windows-TESTONLY
          path: installer-test
      - name: Functional test in the desktop window (test-only build)
        shell: pwsh
        timeout-minutes: 10
        run: |
          Get-Process deepaks-tool -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Get-ChildItem installer-test -Filter *.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $proc = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 10
          node scripts/desktop-smoke.mjs
          $a = $LASTEXITCODE
          "smoke exit: $a"
          node scripts/desktop-convert.mjs
          $b = $LASTEXITCODE
          "convert exit: $b"
          Start-Sleep -Seconds 2
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $sb = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $sbmp = New-Object System.Drawing.Bitmap $sb.Width, $sb.Height
          [System.Drawing.Graphics]::FromImage($sbmp).CopyFromScreen($sb.Location, [System.Drawing.Point]::Empty, $sb.Size)
          $sbmp.Save("$PWD\win-print.png")
          if ($a -ne 0 -or $b -ne 0) { exit 1 }
      - name: Native print dialog, Microsoft Print to PDF save (keyboard automation)
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Snap($n) { $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $m = New-Object System.Drawing.Bitmap $b.Width, $b.Height; [System.Drawing.Graphics]::FromImage($m).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $m.Save("$PWD\out\$n.png") }
          $sh = New-Object -ComObject WScript.Shell
          $ok = $sh.AppActivate("Deepak's Tool")
          "activate: $ok"
          Start-Sleep -Seconds 2
          Snap 'native-1-before-print'
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 5
          Snap 'native-2-after-enter'
          Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object Name, MainWindowTitle | Format-Table | Out-String
          $target = "$PWD\out\native-print.pdf"
          [System.Windows.Forms.SendKeys]::SendWait($target)
          Start-Sleep -Seconds 1
          Snap 'native-3-typed-path'
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 6
          Snap 'native-4-after-save'
          "native-print.pdf exists: $(Test-Path $target)"
          Get-ChildItem out, "$env:USERPROFILE\Documents", "$env:USERPROFILE\Downloads" -Filter *.pdf -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table | Out-String
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Save print views as PDF through WebView2 (raw CDP)
        shell: pwsh
        timeout-minutes: 8
        run: |
          Get-Process deepaks-tool -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Start-Process -FilePath $app.FullName
          Start-Sleep -Seconds 10
          node scripts/desktop-printpdf.mjs
          "printpdf exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Indic PDF to Word saved output
        shell: pwsh
        timeout-minutes: 4
        run: |
          node scripts/desktop-indic-p2w.mjs
          "indic p2w exit: $LASTEXITCODE"
      - name: Real download file name (raw CDP, no Playwright)
        shell: pwsh
        timeout-minutes: 8
        run: |
          Get-Process deepaks-tool -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $before = @(Get-ChildItem "$env:USERPROFILE\Downloads" -ErrorAction SilentlyContinue | ForEach-Object Name)
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Start-Process -FilePath $app.FullName
          Start-Sleep -Seconds 10
          node scripts/desktop-download-names.mjs
          Start-Sleep -Seconds 3
          "Downloads before: $($before -join ', ')"
          "Downloads after:"
          Get-ChildItem "$env:USERPROFILE\Downloads" -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table | Out-String
          Get-ChildItem "$env:USERPROFILE" -Recurse -Filter 'names-test*' -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table | Out-String
      - name: Native PDF save prototype (WebView2 PrintToPdf through a Rust command)
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          Get-Process deepaks-tool -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Start-Process -FilePath $app.FullName
          Start-Sleep -Seconds 10
          node scripts/desktop-nativesave.mjs
          "nativesave exit: $LASTEXITCODE"
      - name: Native PDF save, real tools, isolation, authorization, cleanup
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        run: |
          Get-Process deepaks-tool -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter deepaks-tool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Start-Process -FilePath $app.FullName
          Start-Sleep -Seconds 10
          node scripts/desktop-nativereal.mjs *>&1 | Tee-Object -FilePath out/native-real-log.txt
          "nativereal exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-screenshot
          path: |
            win-smoke.png
            win-after.png
            win-print.png
            rotated.pdf
            ocr.pdf
            out/*

  smoke-linux:
    name: Linux smoke test (xvfb, screenshot)
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deepaks-tool-linux-deb
          path: pkg
      - name: Install, launch under xvfb, screenshot
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick x11-utils xdotool openbox ./pkg/*.deb
          ls -la pkg
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          openbox &
          sleep 2
          WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 deepaks-tool > app.log 2>&1 &
          APP=$!
          sleep 25
          if kill -0 $APP; then echo "app running"; else echo "app exited"; cat app.log; exit 1; fi
          xwininfo -root -tree | head -30
          xdotool search --name "Deepak" 2>/dev/null | head -3 || true
          import -window root linux-smoke.png
          identify linux-smoke.png
          cat app.log | head -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-screenshot
          path: linux-smoke.png
