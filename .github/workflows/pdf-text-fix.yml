name: Fix PDF text replacement (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse concurrent source changes
        run: |
          changes=$(git diff --name-only 83f5993e3d3ab7d1a713b00991a623f6a5ce4842 HEAD | grep -v '^.github/workflows/pdf-text-fix.yml$' || true)
          if [ -n "$changes" ]; then
            echo 'Source changed since tested baseline. Refusing to overwrite it.'
            printf '%s\n' "$changes"
            exit 1
          fi
