name: Regenerate npm lockfile

on:
  push:
    branches: [fix/regenerate-npm-lockfile]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/regenerate-npm-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile"
          git push origin HEAD:fix/regenerate-npm-lockfile
