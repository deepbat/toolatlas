name: Apply ToolAtlas 2 upgrade (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve concurrent source edits
        run: |
          changes=$(git diff --name-only cf1d92a HEAD | grep -v '^.github/workflows/toolatlas-upgrade.yml$' || true)
          if [ -n "$changes" ]; then
            echo 'Source changed since the reviewed baseline. Refusing to overwrite it.'
            printf '%s\n' "$changes"
            exit 1
          fi
      - name: Apply reviewed source bundle
        shell: python
        run: |
          import base64, io, pathlib, tarfile
          bundle = tarfile.open(fileobj=io.BytesIO(base64.b64decode('')), mode='r:gz')
          for item in bundle.getmembers():
              path = pathlib.Path(item.name)
              if path.is_absolute() or '..' in path.parts or not item.isfile():
                  raise ValueError('Invalid source path')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(bundle.extractfile(item).read())
          print('Applied', len(bundle.getmembers()), 'source files')
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit tested source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Ship ToolAtlas 2: 86 tools, offline release, static SEO and publishing foundation'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy verified release
        id: deployment
        uses: actions/deploy-pages@v4
