<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body { margin:0; padding:0; background:#666; }
  .docx-wrapper { background:#666; padding:0; }
  .docx-wrapper > section.docx { box-shadow:none; margin:0; }
</style>
<script type="module" src="/bundle-paint.js"></script>
</head><body>
<div id="container"></div>
<script type="module">
  (async () => {
    try {
      const params = new URLSearchParams(location.search);
      const file = params.get('file') || 'complex.docx';
      const res = await fetch('/fixtures/' + file);
      const buf = await res.arrayBuffer();
      const b64 = await window.convertDocx(buf);
      window.__pdfB64 = b64;
      document.title = 'PAINTED';
    } catch (e) {
      document.title = 'ERROR: ' + (e && e.message);
      console.error(e);
    }
  })();
</script>
</body></html>
