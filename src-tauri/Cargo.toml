[package]
name = "deepaks-tool"
version = "0.1.0"
description = "Deepak's Tool desktop shell (wraps the static on-device site)"
edition = "2021"

[lib]
name = "deepaks_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# Prototype: WebView2 PrintToPdf save command. Off by default, so the shipped build is unchanged.
native-pdf = ["dep:webview2-com", "dep:windows"]

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.39", optional = true }
windows = { version = "0.62", optional = true }
