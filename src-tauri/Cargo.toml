[package]
name = "deepaks-tool"
version = "0.1.0"
description = "Deepak's Tool desktop shell (wraps the static on-device site)"
edition = "2021"

[lib]
name = "deepaks_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["native-pdf"]
# WebView2 PrintToPdf save command (Windows only): the desktop "Selectable text" Word/Excel to PDF save.
native-pdf = ["dep:webview2-com", "dep:windows"]
# CI-only hooks and call markers for the cleanup and authorization tests. Never part of a shipped build.
native-pdf-test = ["native-pdf"]

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.39", optional = true }
windows = { version = "0.62", optional = true }
